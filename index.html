<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create your account · Zippo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="stage">

  <!-- LEFT: brand / mascot -->
  <div class="brand-panel">
    <div class="stripe-band">
      <div class="s1"></div>
      <div class="s2"></div>
      <div class="s3"></div>
    </div>

    <div class="brand-content">
      <h2>Learning is better<br/>as a game.</h2>
      <p>
        
        Join 2M+ streakers
      </p>

      
    </div>
  </div>

  <!-- RIGHT: form -->
  <div class="form-panel">
    <div class="card">
      <h1>Create your account</h1>
      <div class="banner" id="banner"></div>

      <form id="signupForm" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <input type="text" id="username" placeholder="Pick a username" autocomplete="username" required />
          </div>
          <div class="hint" id="usernameHint"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="Make it a strong one" autocomplete="new-password" required />
            <button type="button" class="toggle-eye" id="togglePw">SHOW</button>
          </div>
          <div class="strength-row" id="strengthRow">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          </div>
          <div class="hint" id="pwHint"></div>
        </div>

        <label class="terms">
          <input type="checkbox" id="terms" required />
          <span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></span>
        </label>

        <button type="submit" class="btn btn-primary" id="signupBtn">
          Let's go
        </button>

        <div class="divider">or</div>

        <button type="button" class="btn btn-google" id="googleBtn">
        <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="40" height="40" viewBox="0 0 48 48">
<path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
</svg>
          Continue with Google
        </button>
      </form>

      <p class="switch-line">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>

// Redirect straight to home if a session already exists
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    window.location.href = "home.html";
  }
})();

const googleBtn = document.getElementById('googleBtn');
const form = document.getElementById('signupForm');
const usernameInput = document.getElementById('username');
const pwInput = document.getElementById('password');
const termsInput = document.getElementById('terms');
const banner = document.getElementById('banner');
const signupBtn = document.getElementById('signupBtn');
const togglePw = document.getElementById('togglePw');
const strengthBars = document.querySelectorAll('#strengthRow .bar');

function isValidUsername(u) {
  return /^[a-zA-Z0-9_.]{3,20}$/.test(u);
}

googleBtn.addEventListener('click', async () => {
  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/home.html' }
  });
  if (error) showBanner(banner, error.message, "error");
});

togglePw.addEventListener('click', () => {
  const isPw = pwInput.type === 'password';
  pwInput.type = isPw ? 'text' : 'password';
  togglePw.textContent = isPw ? 'HIDE' : 'SHOW';
});

pwInput.addEventListener('input', () => {
  const v = pwInput.value;
  let score = 0;
  if (v.length >= 6) score++;
  if (/[A-Z]/.test(v) && /[0-9]/.test(v)) score++;
  if (v.length >= 10 && /[^A-Za-z0-9]/.test(v)) score++;
  strengthBars.forEach((bar, i) => {
    bar.className = 'bar';
    if (i < score) bar.classList.add(`on-${score}`);
  });
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  banner.className = 'banner';

  const username = usernameInput.value.trim();
  const password = pwInput.value;

  document.getElementById('usernameHint').textContent = '';
  document.getElementById('pwHint').textContent = '';
  [usernameInput, pwInput].forEach(i => i.classList.remove('error'));

  let hasError = false;
  if (!isValidUsername(username)) {
    document.getElementById('usernameHint').textContent = '3-20 characters: letters, numbers, _ or . only.';
    usernameInput.classList.add('error');
    hasError = true;
  }
  if (password.length < 6) {
    document.getElementById('pwHint').textContent = 'Use at least 6 characters.';
    pwInput.classList.add('error');
    hasError = true;
  }
  if (!termsInput.checked) {
    showBanner(banner, "Please accept the Terms to continue.", "error");
    hasError = true;
  }
  if (hasError) return;

  setLoading(signupBtn, true, "Let's go", "Creating account...");

  // Check if the username is already taken before creating the account
  const { data: existing } = await supabaseClient
    .from('profiles')
    .select('id')
    .eq('username', username.toLowerCase())
    .maybeSingle();

  if (existing) {
    setLoading(signupBtn, false, "Let's go", "Creating account...");
    document.getElementById('usernameHint').textContent = 'That username is already taken.';
    usernameInput.classList.add('error');
    return;
  }

  // Supabase Auth requires an email under the hood — we synthesize one
  // from the username so the user never sees or types an email.
  const internalEmail = `${username.toLowerCase()}@users.internal.zippo`;

  const { data, error } = await supabaseClient.auth.signUp({
    email: internalEmail,
    password: password,
    options: {
      data: { username: username, display_name: username }
    }
  });

  setLoading(signupBtn, false, "Let's go", "Creating account...");

  if (error) {
    showBanner(banner, error.message || "Could not create account.", "error");
    return;
  }

  showBanner(banner, "Account created! Redirecting...", "success");
  window.location.href = "home.html";
});
</script>
</body>
</html>
