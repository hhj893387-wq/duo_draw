<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create your account · Zippo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="stage">

  <!-- LEFT: brand / mascot -->
  <div class="brand-panel">
    <div class="stripe-band">
      <div class="s1"></div>
      <div class="s2"></div>
      <div class="s3"></div>
    </div>

    <div class="brand-content">
      

      
      <h2>Learning is better<br/>as a game.</h2>
      <p>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="vertical-align:-3px; margin-right:4px;">
          <path d="M12 2C12 6 8 8 8 13a4 4 0 0 0 8 0c0-1.5-1-2.5-1-2.5S17 12 17 15a5 5 0 0 1-10 0C7 8 12 6 12 2Z" fill="#2E2A24"/>
        </svg>
        Join 2M+ streakers
      </p>

      <div class="streak-row">
        <div class="streak-dot filled"></div>
        <div class="streak-dot filled"></div>
        <div class="streak-dot filled"></div>
        <div class="streak-dot"></div>
        <div class="streak-dot"></div>
      </div>
    </div>
  </div>

  <!-- RIGHT: form -->
  <div class="form-panel">
    <div class="card">
      <h1>Create your account</h1>
      <div class="banner" id="banner"></div>

      <form id="signupForm" novalidate>
        <div class="field">
          <label for="name">Nickname</label>
          <div class="input-wrap">
            <input type="text" id="name" placeholder="What should we call you?" autocomplete="name" required />
          </div>
          <div class="hint" id="nameHint"></div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <div class="hint" id="emailHint"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="Make it a strong one" autocomplete="new-password" required />
            <button type="button" class="toggle-eye" id="togglePw">SHOW</button>
          </div>
          <div class="strength-row" id="strengthRow">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          </div>
          <div class="hint" id="pwHint"></div>
        </div>

        <label class="terms">
          <input type="checkbox" id="terms" required />
          <span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a> — and I promise to keep my streak alive.</span>
        </label>


<div class="divider">or</div>

<button type="button" class="btn btn-google" id="googleBtn">
  <svg width="18" height="18" viewBox="0 0 48 48">
    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.8-.4-3.5z"/>
    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 15.8 3 8.7 7.7 6.3 14.7z"/>
    <path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.8 14.1-5l-6.5-5.3C29.6 36.5 26.9 37.5 24 37.5c-5.3 0-9.6-3.4-11.2-8l-6.6 5.1C8.7 40.3 15.8 45 24 45z"/>
    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.5 5.3C41.4 35.4 45 30.2 45 24c0-1.4-.1-2.8-.4-3.5z"/>
  </svg>
  Continue with Google
</button>



       <button type="submit" class="btn btn-primary" id="signupBtn">
          Let's go
          
          </svg>
        </button>
      </form>

      <div class="divider">or</div>

      <p class="switch-line">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>

const googleBtn = document.getElementById('googleBtn');


  const form = document.getElementById('signupForm');
  const nameInput = document.getElementById('name');
  const emailInput = document.getElementById('email');
  const pwInput = document.getElementById('password');
  const termsInput = document.getElementById('terms');
  const banner = document.getElementById('banner');
  const signupBtn = document.getElementById('signupBtn');
  const togglePw = document.getElementById('togglePw');
  const strengthBars = document.querySelectorAll('#strengthRow .bar');

googleBtn.addEventListener('click', async () => {
  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: window.location.origin + '/home.html'
    }
  });

  if (error) {
    showBanner(banner, error.message, "error");
  }
  // On success, Supabase redirects the browser to Google automatically —
  // no further action needed here.
});


  togglePw.addEventListener('click', () => {
    const isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    togglePw.textContent = isPw ? 'HIDE' : 'SHOW';
  });

  pwInput.addEventListener('input', () => {
    const v = pwInput.value;
    let score = 0;
    if (v.length >= 6) score++;
    if (/[A-Z]/.test(v) && /[0-9]/.test(v)) score++;
    if (v.length >= 10 && /[^A-Za-z0-9]/.test(v)) score++;
    strengthBars.forEach((bar, i) => {
      bar.className = 'bar';
      if (i < score) bar.classList.add(`on-${score}`);
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    banner.className = 'banner';

    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    const password = pwInput.value;

    document.getElementById('nameHint').textContent = '';
    document.getElementById('emailHint').textContent = '';
    document.getElementById('pwHint').textContent = '';
    [nameInput, emailInput, pwInput].forEach(i => i.classList.remove('error'));

    let hasError = false;
    if (name.length < 2) {
      document.getElementById('nameHint').textContent = 'Give us at least 2 characters.';
      nameInput.classList.add('error');
      hasError = true;
    }
    if (!isValidEmail(email)) {
      document.getElementById('emailHint').textContent = 'That email doesn\'t look right.';
      emailInput.classList.add('error');
      hasError = true;
    }
    if (password.length < 6) {
      document.getElementById('pwHint').textContent = 'Use at least 6 characters.';
      pwInput.classList.add('error');
      hasError = true;
    }
    if (!termsInput.checked) {
      showBanner(banner, "Please accept the Terms to continue.", "error");
      hasError = true;
    }
    if (hasError) return;

    setLoading(signupBtn, false, "Let's go", "Creating account...");

    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: {
        data: { display_name: name }
      }
    });

    setLoading(signupBtn, false, "Let's go ", "Creating account...");

    if (error) {
      showBanner(banner, error.message, "error");
      return;
    }

    showBanner(banner, "Account created! Check your email to confirm", "success");
    form.reset();
    strengthBars.forEach(bar => bar.className = 'bar');
  });
</script>
</body>
</html>
