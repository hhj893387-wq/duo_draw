<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sketch Quest — Lesson 1: Straight Lines</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFE053;
  --coral:#FE6474;
  --blue:#4279DA;
  --ink:#2E2A24;
  --cream:#FFFCF5;
  --white:#FFFFFF;
  --gray:#8A8378;
  --green:#8FD44C;
  --lockgray:#D9D3C4;
  --radius-lg:28px;
  --radius-md:18px;
  --radius-sm:12px;
  --shadow-off:6px;
  --card-pad:clamp(8px,1.6vh,16px);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
html{ height:100%; }
body{
  font-family:'Baloo 2','Nunito',sans-serif;
  background:var(--white);
  color:var(--ink);
  height:100vh;
  height:100dvh;
  overflow:hidden;
}
h1,h2,h3{ font-family:'Baloo 2',sans-serif; margin:0; }
p,span,button{ font-family:'Nunito',sans-serif; }

.page{
  max-width:720px;
  height:100vh;
  height:100dvh;
  margin:0 auto;
  padding:clamp(8px,1.6vh,18px) clamp(12px,4vw,18px) clamp(8px,1.6vh,16px);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ---------- top bar ---------- */
.topbar{
  display:flex;
  align-items:center;
  gap:clamp(8px,2vw,14px);
  margin-bottom:clamp(6px,1.6vh,22px);
  flex-shrink:0;
}
.exit-btn{
  width:clamp(30px,4.2vh,40px); height:clamp(30px,4.2vh,40px);
  border-radius:50%;
  border:3px solid var(--ink);
  background:var(--white);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  box-shadow:3px 3px 0 var(--ink);
  transition:transform .1s ease, box-shadow .1s ease;
}
.exit-btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
.exit-btn svg{ width:clamp(14px,2.2vh,18px); height:clamp(14px,2.2vh,18px); }

.progress-track{
  flex:1;
  height:clamp(12px,2vh,18px);
  background:var(--white);
  border:3px solid var(--ink);
  border-radius:999px;
  padding:2px;
  position:relative;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  width:0%;
  border-radius:999px;
  background:var(--green);
  transition:width .6s cubic-bezier(.34,1.2,.4,1);
}

.round-label{
  display:none;
}

.heart-display{
  display:flex;
  align-items:center;
  gap:4px;
  flex-shrink:0;
  font-family:'Baloo 2',sans-serif;
  font-weight:800;
  font-size:clamp(13px,2vh,16px);
  color:var(--ink);
}
.heart-display svg{
  width:clamp(20px,3vh,26px);
  height:clamp(20px,3vh,26px);
  flex-shrink:0;
}
.round-title{
  text-align:center;
  font-size:clamp(16px,2.6vh,24px);
  font-weight:800;
  margin-bottom:clamp(8px,1.8vh,18px);
  flex-shrink:0;
}

/* ---------- canvas card ---------- */
.canvas-card{
  position:relative;
  background:var(--cream);
  border:4px solid var(--ink);
  border-radius:var(--radius-lg);
  padding:6px;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.canvas-wrap{
  position:relative;
  width:100%;
  height:100%;
  border-radius:var(--radius-md);
  overflow:hidden;
  background:var(--cream);
  touch-action:none;
}
.canvas-wrap canvas{
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  display:block;
}
#guideCanvas{ z-index:1; }
#drawCanvas{ z-index:2; cursor:crosshair; }



.controls-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:clamp(10px,3vw,16px);
  width:100%;
  margin-top:clamp(12px,2.2vh,18px);
  flex-shrink:0;
}
.btn-icon-round{
  width:52px; height:52px;
  border-radius:50%;
  border:3px solid var(--ink);
  background:var(--white);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  box-shadow:0 4px 0 var(--ink);
  transition:transform .08s ease, box-shadow .08s ease;
}
.btn-icon-round:active{ transform:translateY(4px); box-shadow:0 0 0 var(--ink); }
.btn-icon-round svg{ width:20px; height:20px; }

/* ---------- chunky buttons (from styles.css pattern) ---------- */
.btn{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:15px 18px;
  font-family:'Baloo 2',sans-serif;
  font-size:16px;
  font-weight:800;
  letter-spacing:.02em;
  color:var(--ink);
  background:var(--yellow);
  border:3px solid var(--ink);
  border-radius:var(--radius-sm);
  cursor:pointer;
  box-shadow:0 var(--shadow-off) 0 var(--ink);
  transform:translateY(0);
  transition:transform .08s ease, box-shadow .08s ease, background .15s ease, opacity .15s ease;
}
.btn svg{ width:18px; height:18px; flex-shrink:0; }
.btn:hover:not(:disabled){ background:#FFE87A; }
.btn:active:not(:disabled),
.btn.pressed{ transform:translateY(6px); box-shadow:0 0 0 var(--ink); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

.btn-outline{ background:var(--white); color:var(--gray); flex:0 0 auto; padding:15px 18px; }
.btn-outline:hover:not(:disabled){ background:#F5F1E6; }

.btn-primary{ background:var(--green); color:var(--ink); flex:1 1 100%; font-size:19px; padding:17px 18px; }
.btn-primary:hover:not(:disabled){ background:#A2E066; }

.btn-coral{ background:var(--coral); color:var(--white); }
.btn-coral:hover:not(:disabled){ background:#FF7A8B; }

.btn-blue{ background:var(--blue); color:var(--white); }
.btn-blue:hover:not(:disabled){ background:#5A8CE6; }

/* ---------- feedback popup (inline, over canvas card) ---------- */
/* ---------- result banner (success / fail bottom sheet) ---------- */
.result-banner{
  position:absolute;
  left:calc(-1 * var(--card-pad));
  right:calc(-1 * var(--card-pad));
  bottom:calc(-1 * var(--card-pad));
  display:none;
  align-items:center;
  gap:14px;
  padding:18px 20px 20px;
  border-radius:0 0 var(--radius-lg) var(--radius-lg);
  z-index:30;
  animation:bannerUp .32s cubic-bezier(.34,1.56,.64,1);
}
.result-banner.show{ display:flex; }
@keyframes bannerUp{
  0%{ opacity:0; transform:translateY(30px); }
  100%{ opacity:1; transform:translateY(0); }
}
.result-banner--success{ background:var(--green); }
.result-banner--fail{ background:var(--coral); }

.result-icon{
  width:52px; height:52px;
  flex-shrink:0;
  border-radius:50%;
  background:var(--white);
  border:3px solid var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
  animation:iconPop .5s cubic-bezier(.34,1.76,.64,1) .1s both;
}
@keyframes iconPop{
  0%{ transform:scale(0) rotate(-20deg); }
  60%{ transform:scale(1.18) rotate(6deg); }
  100%{ transform:scale(1) rotate(0deg); }
}
.result-icon svg{ width:26px; height:26px; }

.result-text{ flex:1; min-width:0; }
.result-title{ font-size:19px; font-weight:800; color:var(--white); line-height:1.15; }
.result-sub{ font-size:13px; font-weight:700; color:var(--white); opacity:.92; margin-top:2px; line-height:1.3; }

.btn-banner{
  flex-shrink:0;
  padding:13px 18px;
  font-family:'Baloo 2',sans-serif;
  font-size:15px;
  font-weight:800;
  color:var(--ink);
  background:var(--white);
  border:3px solid var(--ink);
  border-radius:var(--radius-sm);
  cursor:pointer;
  box-shadow:0 4px 0 var(--ink);
  transition:transform .08s ease, box-shadow .08s ease;
}
.btn-banner:active{ transform:translateY(4px); box-shadow:0 0 0 var(--ink); }

.btn-check{
  background:var(--green);
  color:var(--ink);
  margin-left:auto;
}
.btn-check:hover:not(:disabled){ background:#A2E066; }
.btn-check:disabled{ opacity:.45; cursor:not-allowed; }

.btn-check-retry{
  background:var(--coral);
  color:var(--white);
  margin-left:auto;
}
.btn-check-retry:hover{ background:#FF7A8B; }

/* ---------- failure / tips takeover ---------- */


/* ---------- toast for xp/coin pickup ---------- */
.combo-label{
  text-align:center;
  font-family:'Baloo 2',sans-serif;
  font-weight:800;
  font-size:clamp(13px,2vh,17px);
  color:var(--blue);
  letter-spacing:.01em;
  height:0;
  max-height:0;
  opacity:0;
  overflow:hidden;
  flex-shrink:0;
}
.combo-label.show{
  max-height:28px;
  height:auto;
  opacity:1;
  margin-bottom:4px;
  animation:comboPop 1.8s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes comboPop{
  0%{ transform:scale(.4) translateY(10px); opacity:0; }
  15%{ transform:scale(1.15) translateY(0); opacity:1; }
  25%{ transform:scale(1); }
  80%{ transform:scale(1); opacity:1; }
  100%{ transform:scale(.96); opacity:0; }
}

/* ---------- success screen ---------- */
.success-screen{
  position:fixed;
  inset:0;
  background:var(--cream);
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:500;
  padding:28px;
  text-align:center;
  overflow:hidden;
}
.success-screen.show{ display:flex; }

.confetti{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.confetti span{
  position:absolute;
  top:-40px;
  width:12px; height:12px;
  border-radius:3px;
  opacity:.95;
  animation:fall linear infinite;
}
@keyframes fall{
  to{ transform:translateY(115vh) rotate(400deg); }
}

.trophy-badge{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  
  margin-bottom:20px;
  animation:trophyPop .6s cubic-bezier(.34,1.76,.64,1) both, trophyBob 2.4s ease-in-out 1s infinite;
  z-index:2;
}
@keyframes trophyPop{
  0%{ transform:scale(0) rotate(-25deg); opacity:0; }
  65%{ transform:scale(1.15) rotate(8deg); opacity:1; }
  100%{ transform:scale(1) rotate(0deg); }
}
@keyframes trophyBob{
  0%,100%{ transform:translateY(0) rotate(0deg); }
  50%{ transform:translateY(-8px) rotate(-3deg); }
}
.trophy-badge svg{ width:58px; height:58px; }

.success-screen h1{ font-size:30px; margin-bottom:6px; z-index:2; }
.success-screen .sub{ font-size:15px; font-weight:700; color:var(--gray); margin-bottom:26px; z-index:2; }

.stats-row{
  display:flex;
  gap:12px;
  margin-bottom:28px;
  z-index:2;
}
.stat-card{
  background:var(--white);
  border:3px solid var(--ink);
  border-radius:var(--radius-sm);
  padding:14px 18px;
  min-width:96px;
  box-shadow:4px 4px 0 var(--ink);
}
.stat-card svg{ width:26px; height:26px; margin-bottom:6px; }
.stat-card .num{ font-size:22px; font-weight:800; display:block; }
.stat-card .lbl{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--gray); }

.streak-line{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--white);
  border:3px solid var(--ink);
  border-radius:999px;
  padding:8px 18px 8px 12px;
  margin-bottom:30px;
  z-index:2;
  box-shadow:3px 3px 0 var(--ink);
}
.streak-line svg{ width:22px; height:22px; }
.streak-line span{ font-weight:800; font-size:14px; }

.success-screen .btn-primary{
  flex:0 0 auto;
  width:100%;
  max-width:320px;
  z-index:2;
}
/* ---------- responsive ---------- */
@media (max-width:420px){
  .round-title{ font-size:20px; }
  .stats-row{ gap:8px; }
  .stat-card{ padding:12px 14px; min-width:84px; }
}
</style>
</head>

  <div class="round-label" id="roundLabel">Lesson 3 of 6</div>

  <!-- CANVAS CARD -->
  <div class="canvas-card">

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="guideCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
    </div>

    <!-- success / good result banner -->
    <div class="result-banner result-banner--success" id="feedbackOverlay">
      <div class="result-icon" id="feedbackIcon"></div>
      <div class="result-text">
        <div class="result-title" id="feedbackTitle">Excellent!</div>

    <div class="result-banner result-banner--fail" id="failureOverlay">

</div>

<script>
/* ---------------- round definitions ---------------- */
const rounds = [
  { name:'Horizontal',      title:'Trace the horizontal line', a:[0.10,0.50], b:[0.90,0.50] },
  { name:'Vertical',        title:'Trace the vertical line',   a:[0.50,0.12], b:[0.50,0.88] },

];

const excellentPhrases = ['Excellent!', 'Line wizard!', 'Chef\'s kiss!', 'Steady hands!', 'Nailed it!'];
const goodPhrases = ['Good!', 'Nice control!', 'Getting sharper!', 'Solid line!', 'You\'ve got this!'];
const nearMissPhrases = ['So close!', 'Almost there!', 'Just a hair off!'];

let comboStreak = 0; // consecutive "excellent" rounds this lesson — resets on any non-excellent

let roundIndex = 0;
let attemptsThisRound = 0;
let totalXp = 0;
let totalCoins = 0;

// Multi-stroke tracking
let strokes = [];          // finished strokes: array of arrays of [x,y]
let currentStroke = [];    // stroke currently being drawn
let hasDrawn = false;
let drawing = false;

/* ---------------- DOM refs ---------------- */
const progressTrack = document.getElementById('progressTrack');
const roundLabel = document.getElementById('roundLabel');
const roundTitle = document.getElementById('roundTitle');
const canvasWrap = document.getElementById('canvasWrap');
const guideCanvas = document.getElementById('guideCanvas');

const clearBtn = document.getElementById('clearBtn');

const feedbackTitle = document.getElementById('feedbackTitle');
const failureOverlay = document.getElementById('failureOverlay');
const failureSub = document.getElementById('failureSub');
let checkMode = 'check'; // 'check' | 'continue' | 'retry'
const comboLabel = document.getElementById('comboLabel');
let comboLabelTimer = null;
const successScreen = document.getElementById('successScreen');
const totalXpEl = document.getElementById('totalXp');
const totalCoinsEl = document.getElementById('totalCoins');

const successSound = new Audio('assets/sound/success.mp3');
const failSound = new Audio('assets/sound/fail.mp3');
successSound.preload = 'auto';
failSound.preload = 'auto';
function playSound(audio){
  try{
    audio.currentTime = 0;
    audio.play().catch(()=>{ /* autoplay blocked until first user gesture — fine, checks always follow a tap */ });
  } catch(e){ /* no-op */ }
}

/* ---------------- icons ---------------- */
const ICONS = {
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l2.6 5.9 6.4.6-4.8 4.3 1.4 6.3L12 16.9 6.4 20.1l1.4-6.3-4.8-4.3 6.4-.6L12 3z"></path></svg>',
  thumb:'<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 22V11M2 13v7a2 2 0 0 0 2 2h12.6a2 2 0 0 0 2-1.6l1.3-6A2 2 0 0 0 18 12h-5l1-5.5A1.5 1.5 0 0 0 12.6 4.8L7 11"></path></svg>',
  refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11A8 8 0 1 0 18.5 16"></path><path d="M20 5v6h-6"></path></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"></path></svg>'
};

/* ---------------- idle nudges ---------------- */
let idleTimer = null;
function resetIdleTimer(){ /* hint removed — no-op kept so existing calls still work */ }


/* ---------------- setup canvas ---------------- */
function sizeCanvases(){
  const rect = canvasWrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  [guideCanvas, drawCanvas].forEach(c=>{
    c.width = rect.width * dpr;
    c.height = rect.height * dpr;
  });
  gctx.setTransform(dpr,0,0,dpr,0,0);
  dctx.setTransform(dpr,0,0,dpr,0,0);
  drawGuide();
}

function pt(p){
  const rect = canvasWrap.getBoundingClientRect();
  return [p[0]*rect.width, p[1]*rect.height];
}

function drawGuide(){
  const rect = canvasWrap.getBoundingClientRect();
  gctx.clearRect(0,0,rect.width,rect.height);
  const r = rounds[roundIndex];
  const [ax,ay] = pt(r.a);
  const [bx,by] = pt(r.b);

  gctx.save();
  gctx.strokeStyle = '#C9C1AE';
  gctx.lineWidth = 4;
  gctx.lineCap = 'round';
  gctx.setLineDash([2,14]);
  gctx.beginPath();
  gctx.moveTo(ax,ay);
  gctx.lineTo(bx,by);
  gctx.stroke();
  gctx.restore();

  gctx.beginPath();
  gctx.arc(ax,ay,7,0,Math.PI*2);
  gctx.fillStyle = '#8FD44C';
  gctx.fill();
  gctx.lineWidth = 3;
  gctx.strokeStyle = '#2E2A24';
  gctx.stroke();

  gctx.beginPath();
  gctx.arc(bx,by,7,0,Math.PI*2);
  gctx.fillStyle = '#FE6474';
  gctx.fill();
  gctx.stroke();
}

function clearDraw(){
  const rect = canvasWrap.getBoundingClientRect();
  dctx.clearRect(0,0,rect.width,rect.height);
  strokes = [];
  currentStroke = [];
  hasDrawn = false;
  checkBtn.disabled = true;
  resetIdleTimer();
}

/* ---------------- drawing input ---------------- */
function getPos(e){
  const rect = drawCanvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return [clientX-rect.left, clientY-rect.top];
}

function startDraw(e){
  e.preventDefault();
  clearInterval(idleTimer); // stop nudging once they've actually started
  drawing = true;
  currentStroke = [];
  const [x,y] = getPos(e);
  currentStroke.push([x,y]);
  dctx.beginPath();
  dctx.moveTo(x,y);
}
function moveDraw(e){
  if(!drawing) return;
  e.preventDefault();
  const [x,y] = getPos(e);
  currentStroke.push([x,y]);
  dctx.strokeStyle = '#4279DA';
  dctx.lineWidth = 6;
  dctx.lineCap = 'round';
  dctx.lineJoin = 'round';
  dctx.lineTo(x,y);
  dctx.stroke();
}
function endDraw(e){
  if(!drawing) return;
  drawing = false;
  if(currentStroke.length > 1){
    strokes.push(currentStroke);
  }
  currentStroke = [];
  const totalPoints = strokes.reduce((n,s)=>n+s.length, 0);
  hasDrawn = totalPoints > 3;
  checkBtn.disabled = !hasDrawn;
}

drawCanvas.addEventListener('pointerdown', startDraw);
drawCanvas.addEventListener('pointermove', moveDraw);
window.addEventListener('pointerup', endDraw);
drawCanvas.addEventListener('touchstart', startDraw, {passive:false});
drawCanvas.addEventListener('touchmove', moveDraw, {passive:false});
window.addEventListener('touchend', endDraw);

clearBtn.addEventListener('click', ()=>{
  feedbackOverlay.classList.remove('show');
  failureOverlay.classList.remove('show');
  clearDraw();
  switchToCheck();
});

document.getElementById('exitBtn').addEventListener('click', ()=>{
  comboStreak = 0;
  window.location.href = 'home.html';
});

/* ---------------- scoring ---------------- */
function scoreStroke(){
  const r = rounds[roundIndex];
  const [ax,ay] = pt(r.a);
  const [bx,by] = pt(r.b);
  const dx = bx-ax, dy = by-ay;
  const guideLen = Math.hypot(dx,dy);
  const ux = dx/guideLen, uy = dy/guideLen;

  const allPoints = strokes.flat();
  if(allPoints.length < 2 || guideLen === 0) return 0;

  let drawnLength = 0;
  strokes.forEach(stroke=>{
    for(let i=1;i<stroke.length;i++){
      drawnLength += Math.hypot(stroke[i][0]-stroke[i-1][0], stroke[i][1]-stroke[i-1][1]);
    }
  });
  const lengthRatio = drawnLength / guideLen;

  const SAMPLES = 40;
  const coverThreshold = Math.max(16, guideLen * 0.05);
  let coveredCount = 0;
  for(let i=0;i<=SAMPLES;i++){
    const t = i/SAMPLES;
    const sx = ax + dx*t, sy = ay + dy*t;
    let minDist = Infinity;
    for(const p of allPoints){
      const d = Math.hypot(p[0]-sx, p[1]-sy);
      if(d < minDist){ minDist = d; if(minDist < coverThreshold) break; }
    }
    if(minDist <= coverThreshold) coveredCount++;
  }
  const coverage = coveredCount / (SAMPLES+1);

  let devSum = 0;
  let strayCount = 0;
  allPoints.forEach(([x,y])=>{
    const vx = x-ax, vy = y-ay;
    const proj = Math.max(0, Math.min(guideLen, vx*ux + vy*uy));
    const cx = ax + ux*proj, cy = ay + uy*proj;
    const dist = Math.hypot(x-cx, y-cy);
    devSum += dist;
    if(dist > guideLen * 0.15) strayCount++;
  });
  const avgDev = devSum / allPoints.length;
  const devNorm = Math.min(1, avgDev / (guideLen * 0.12));
  const accuracyScore = Math.max(0, 1 - devNorm);
  const strayPenalty = (strayCount / allPoints.length) * 0.4;

  let lengthScore;
  if(lengthRatio < 0.15){
    lengthScore = 0;
  } else if(lengthRatio < 0.8){
    lengthScore = lengthRatio / 0.8;
  } else if(lengthRatio <= 1.3){
    lengthScore = 1;
  } else {
    lengthScore = Math.max(0, 1 - (lengthRatio - 1.3) * 0.5);
  }

  let smoothnessSum = 0, smoothCount = 0;
  strokes.forEach(stroke=>{
    if(stroke.length < 2) return;
    const [x0,y0] = stroke[0];
    const [x1,y1] = stroke[stroke.length-1];
    const straight = Math.hypot(x1-x0, y1-y0);
    let path = 0;
    for(let i=1;i<stroke.length;i++){
      path += Math.hypot(stroke[i][0]-stroke[i-1][0], stroke[i][1]-stroke[i-1][1]);
    }
    if(path > 0){
      smoothnessSum += Math.min(1, straight/path);
      smoothCount++;
    }
  });
  const smoothness = smoothCount ? smoothnessSum / smoothCount : 0;
  const strokeCountPenalty = Math.max(0, (strokes.length - 1) * 0.15);
  const continuityScore = Math.max(0, smoothness - strokeCountPenalty);

  let score = (
    coverage        * 0.40 +
    accuracyScore   * 0.30 +
    lengthScore     * 0.20 +
    continuityScore * 0.10
  ) * 100;

  score -= strayPenalty * 100;

  if(drawnLength < guideLen * 0.12 || lengthRatio < 0.15){
    score = Math.min(score, 8);
  } else if(coverage < 0.30){
    score = Math.min(score, 20);
  } else if(coverage < 0.55){
    score = Math.min(score, 55);
  }

  return Math.max(0, Math.min(100, Math.round(score)));
}

/* ---------------- flow control ---------------- */
function updateHeader(){
  let fill = progressTrack.querySelector('.progress-fill');
  if(!fill){
    fill = document.createElement('div');
    fill.className = 'progress-fill';
    progressTrack.appendChild(fill);
  }
  const pct = (roundIndex / rounds.length) * 100;
  requestAnimationFrame(()=>{ fill.style.width = pct + '%'; });
  roundLabel.textContent = 'Line ' + (roundIndex+1) + ' of ' + rounds.length;
  roundTitle.textContent = rounds[roundIndex].title;
}
function showToast(xp, coins, isCombo){
  if(!isCombo || comboStreak < 1) return;
  clearTimeout(comboLabelTimer);
  comboLabel.classList.remove('show');
  void comboLabel.offsetWidth; // restart animation if triggered again quickly
  comboLabel.textContent = 'Combo ' + comboStreak + '';
  comboLabel.classList.add('show');
  comboLabelTimer = setTimeout(()=> comboLabel.classList.remove('show'), 1800);
}
/* ---------------- check / continue / retry button state machine ---------------- */
function switchToCheck(){
  checkMode = 'check';
  checkBtn.textContent = 'Check';
  checkBtn.classList.remove('btn-check-retry');
  checkBtn.classList.add('btn-check');
  checkBtn.disabled = !hasDrawn;
}
function switchToContinue(){
  checkMode = 'continue';
  checkBtn.textContent = roundIndex === rounds.length-1 ? 'Finish' : 'Continue';
  checkBtn.classList.remove('btn-check-retry');
  checkBtn.classList.add('btn-check');
  checkBtn.disabled = false;
}
function switchToRetry(){
  checkMode = 'retry';
  checkBtn.textContent = 'Try again';
  checkBtn.classList.remove('btn-check');
  checkBtn.classList.add('btn-check-retry');
  checkBtn.disabled = false;
}

let advancing = false; // guards against double-fire on fast double-tap/click

function advanceRound(){
  if(advancing) return;
  advancing = true;
  checkBtn.disabled = true;

  feedbackOverlay.classList.remove('show');
  let xp = isReviewMode ? 0 : parseInt(checkBtn.dataset.xp || 10, 10);
  let coins = isReviewMode ? 0 : parseInt(checkBtn.dataset.coins || 5, 10);
  const isCombo = !isReviewMode && checkBtn.dataset.combo === '1';
  totalXp += xp;
  totalCoins += coins;
  if(!isReviewMode){
    showToast(xp, coins, isCombo);
  }
  addCoins(coins);

if(roundIndex === rounds.length-1){
    persistProgress({ completed:true, xp:totalXp, coins:totalCoins, current_round:roundIndex });
    updateStreak().then(function(result){
      pendingStreakResult = result;
      setTimeout(showSuccess, 500);
    });
    // no need to re-enable — success screen takes over navigation
  } else {
    roundIndex++;
    attemptsThisRound = 0;
    clearDraw();
    switchToCheck();
    updateHeader();
    drawGuide();
    persistProgress({ completed:false, xp:totalXp, coins:totalCoins, current_round:roundIndex });
    advancing = false;
  }
}

checkBtn.addEventListener('click', ()=>{
  if(checkMode === 'continue'){ advanceRound(); return; }
  if(checkMode === 'retry'){
    failureOverlay.classList.remove('show');
    clearDraw();
    switchToCheck();
    return;
  }

  // checkMode === 'check'
  if(!hasDrawn) return;
  const score = scoreStroke();

  if(score >= 85){
    comboStreak++;
    feedbackIcon.innerHTML = ICONS.check;
    feedbackTitle.textContent = excellentPhrases[Math.floor(Math.random()*excellentPhrases.length)];
    feedbackOverlay.classList.add('show');
    playSound(successSound);
    checkBtn.dataset.xp = 15;
    checkBtn.dataset.coins = 8;
    checkBtn.dataset.combo = '1';
    switchToContinue();
  } else if(score >= 60){
    comboStreak++;
    feedbackIcon.innerHTML = ICONS.check;
    feedbackTitle.textContent = goodPhrases[Math.floor(Math.random()*goodPhrases.length)];
    feedbackOverlay.classList.add('show');
    playSound(successSound);
    checkBtn.dataset.xp = 10;
    checkBtn.dataset.coins = 5;
    checkBtn.dataset.combo = '1';
    switchToContinue();
  } else {
    comboStreak = 0;
    attemptsThisRound++;
    if(score >= 45){
      const near = nearMissPhrases[Math.floor(Math.random()*nearMissPhrases.length)];
      failureSub.textContent = near + ' You were only a few points off — keep the stroke steady and try again.';
    } else {
      failureSub.textContent = attemptsThisRound > 1
        ? 'Still a little off the guide — that\'s okay, straight lines take practice.'
        : 'Your line wandered a bit off the guide. Take your time on the next try.';
    }
    failureOverlay.classList.add('show');
    playSound(failSound);
    loseHeart();
    switchToRetry();
  }
});

/* ---------------- success screen ---------------- */
function buildConfetti(){
  const holder = document.getElementById('confetti');
  holder.innerHTML = '';
  const colors = ['#FFE053','#FE6474','#4279DA','#8FD44C'];
  for(let i=0;i<36;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100 + '%';
    s.style.background = colors[i % colors.length];
    s.style.animationDuration = (2.4 + Math.random()*2) + 's';
    s.style.animationDelay = (Math.random()*1.6) + 's';
    s.style.opacity = 0.7 + Math.random()*0.3;
    s.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
    holder.appendChild(s);
  }
}

function countUp(el, target, duration){
  const start = performance.now();
  function tick(now){
    const p = Math.min(1, (now-start)/duration);
    el.textContent = Math.round(target * p);
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function showSuccess(){
  buildConfetti();
  successScreen.classList.add('show');
  countUp(totalXpEl, totalXp, 900);
  countUp(totalCoinsEl, totalCoins, 900);

  // If streak was already logged today, show it quietly here instead
  // of the animated streak screen (per spec: no repeat animation/day).
  const line = document.getElementById('victoryStreakLine');
  const text = document.getElementById('victoryStreakText');
  if(pendingStreakResult && !pendingStreakResult.increased){
    text.textContent = 'Day ' + pendingStreakResult.streak;
    line.style.display = 'flex';
  } else {
    line.style.display = 'none';
  }
}

continueBtn.addEventListener('click', ()=>{
  successScreen.classList.remove('show');
  showStreakAnimation(pendingStreakResult);
});

/* ---------------- progress sync ---------------- */
const LESSON_ID = 'lesson1';   // change to lesson1, lesson2, ... per file
const UNIT_ID = 'unit1';       // change to unit2 for lessons 6-8
const PROGRESS_CACHE_KEY = 'sketchquest_progress_cache';
const PROFILE_STATE_KEY = 'sketchquest_profile_state';
const HEART_MAX = 5;
const HEART_REGEN_MS = 5 * 60 * 1000; // 5 minutes per heart
let currentUserId = null;
let saveQueued = false;

// ?review=1 means the user tapped "Review" on an already-completed lesson.
const isReviewMode = new URLSearchParams(window.location.search).get('review') === '1';
let hearts = HEART_MAX;
let heartsUpdatedAt = new Date().toISOString();
let totalCoinsSaved = 0; // authoritative coin total from profiles table
let heartTimerInterval = null;

function loadCachedProgress(){
  try{ return JSON.parse(localStorage.getItem(PROGRESS_CACHE_KEY) || '{}'); }
  catch(e){ return {}; }
}
function cacheProgress(map){
  try{ localStorage.setItem(PROGRESS_CACHE_KEY, JSON.stringify(map)); } catch(e){}
}
function upsertLocalEntry(patch){
  const map = loadCachedProgress();
  const existing = map[LESSON_ID] || { lesson_id:LESSON_ID, completed:false, xp:0, coins:0, current_round:0 };
  map[LESSON_ID] = Object.assign({}, existing, patch);
  cacheProgress(map);
  return map[LESSON_ID];
}

function loadCachedProfileState(){
  try{ return JSON.parse(localStorage.getItem(PROFILE_STATE_KEY) || '{}'); }
  catch(e){ return {}; }
}
function cacheProfileState(state){
  try{ localStorage.setItem(PROFILE_STATE_KEY, JSON.stringify(state)); } catch(e){}
}

async function persistProgress(patch){
  if(isReviewMode) return;
  const entry = upsertLocalEntry(patch);
  if(!currentUserId){ saveQueued = true; return; }
  try{
    await supabaseClient.from('lesson_progress').upsert({
      user_id: currentUserId,
      lesson_id: LESSON_ID,
      unit_id: UNIT_ID,
      completed: entry.completed,
      xp: entry.xp,
      coins: entry.coins,
      current_round: entry.current_round,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,lesson_id' });
  } catch(e){
    saveQueued = true;
  }
}

/* ---- hearts ---- */
function regenHearts(){
  const elapsed = Date.now() - new Date(heartsUpdatedAt).getTime();
  if(hearts >= HEART_MAX || elapsed <= 0) return;
  const gained = Math.floor(elapsed / HEART_REGEN_MS);
  if(gained > 0){
    hearts = Math.min(HEART_MAX, hearts + gained);
    heartsUpdatedAt = new Date(new Date(heartsUpdatedAt).getTime() + gained * HEART_REGEN_MS).toISOString();
  }
}

function updateHeartUI(){
  regenHearts();
  const heartCountEl = document.getElementById('heartCountDisplay');
  if(heartCountEl) heartCountEl.textContent = hearts;

if(hearts <= 0){
    checkBtn.disabled = true;
    drawCanvas.style.pointerEvents = 'none';
    clearInterval(idleTimer);
    comboStreak = 0;
  } else {
    drawCanvas.style.pointerEvents = 'auto';
    if(checkMode === 'check') checkBtn.disabled = !hasDrawn;
  }
  saveProfileState();
}

function startHeartTimer(){
  if(heartTimerInterval) clearInterval(heartTimerInterval);
  heartTimerInterval = setInterval(updateHeartUI, 1000);
  updateHeartUI();
}

function loseHeart(){
  if(isReviewMode) return;
  regenHearts();
  if(hearts > 0){
    const wasFull = hearts >= HEART_MAX;
    hearts = Math.max(0, hearts - 1);
    if(wasFull) heartsUpdatedAt = new Date().toISOString();
    updateHeartUI();
  }
}

async function saveProfileState(){
  cacheProfileState({ hearts, hearts_updated_at: heartsUpdatedAt, coins: totalCoinsSaved });
  if(!currentUserId) return;
  try{
    await supabaseClient.rpc('update_heart_coin_state', {
      p_hearts: hearts,
      p_hearts_updated_at: heartsUpdatedAt,
      p_coins: totalCoinsSaved
    });
  } catch(e){ /* best effort, cached locally */ }
}

async function addCoins(amount){
  if(isReviewMode) return;
  totalCoinsSaved += amount;
  await saveProfileState();
}


/* ==================== STREAK MODULE ====================
   All streak math happens in Supabase (record_lesson_completion),
   using the DB server's clock. These client functions only call
   that RPC and render the result — they never compute the streak
   themselves, so spoofing the device clock has no effect. */

let pendingStreakResult = null;

// Loads the currently saved streak (for display only — not authoritative)
async function loadStreak(){
  if(!currentUserId) return { streak:0, longest_streak:0 };
  try{
    const { data, error } = await supabaseClient
      .from('profiles')
      .select('current_streak, longest_streak')
      .eq('id', currentUserId)
      .maybeSingle();
    if(error || !data) return { streak:0, longest_streak:0 };
    return { streak:data.current_streak || 0, longest_streak:data.longest_streak || 0 };
  } catch(e){
    return { streak:0, longest_streak:0 };
  }
}

// Called once, exactly when a lesson is completed.
// Server decides whether the streak actually increases.
async function updateStreak(){
  if(isReviewMode || !currentUserId) return null;
  try{
    const { data, error } = await supabaseClient.rpc('record_lesson_completion', {
      p_user_id: currentUserId
    });
    if(error) return null;
    saveStreak(data);
    return data;
  } catch(e){
    return null;
  }
}

// checkMissedDays / useFreeze are handled server-side inside the RPC
// (the ELSE branch there is the "missed day" path, and freeze usage
// is applied automatically when streak_freeze_count > 0). Kept here
// as thin pass-throughs in case you want to call them explicitly.
function checkMissedDays(result){
  return !!result && !result.first_time && result.increased && result.used_freeze === false && result.streak === 1;
}
function useFreeze(result){
  return !!result && result.used_freeze;
}

// Cache streak locally purely for instant UI paint (not for logic)
function saveStreak(result){
  if(!result) return;
  try{
    localStorage.setItem('sketchquest_streak_cache', JSON.stringify({
      streak: result.streak,
      longest_streak: result.longest_streak
    }));
  } catch(e){}
}

function showMilestone(streak){
  if(streak > 0 && streak % 7 === 0){
    streakSub.textContent = 'Day ' + streak + ' — one week strong!';
  }
}

// Renders the post-victory streak screen (fire pop + count-up + bounce),
// reusing the existing trophy-badge / success-screen styles/animations.
function showStreakAnimation(result){
  if(!result){ window.location.href = 'home.html'; return; }

  if(!result.increased){
    // Already counted today — no animation, just land on home.
    window.location.href = 'home.html';
    return;
  }

  streakTitle.textContent = result.first_time ? 'Your journey begins!' : 'Streak +1';
  streakSub.textContent = 'Day ' + result.streak;
  streakScreen.classList.add('show');
  countUp(streakDayCounter, result.streak, 700);
  showMilestone(result.streak);
}

function saveOnExitOrRefresh(){
  if(!currentUserId) return;
  const entry = loadCachedProgress()[LESSON_ID];
  if(entry){
    const payload = JSON.stringify({
      user_id: currentUserId, lesson_id: LESSON_ID, unit_id: UNIT_ID,
      completed: entry.completed, xp: entry.xp, coins: entry.coins,
      current_round: entry.current_round, updated_at: new Date().toISOString()
    });
    try{
      navigator.sendBeacon(
        SUPABASE_URL + '/rest/v1/lesson_progress?on_conflict=user_id,lesson_id',
        new Blob([payload], { type:'application/json' })
      );
    } catch(e){ /* best effort */ }
  }
  try{
    navigator.sendBeacon(
      SUPABASE_URL + '/rest/v1/profiles?id=eq.' + currentUserId,
      new Blob([JSON.stringify({ hearts, hearts_updated_at: heartsUpdatedAt, coins: totalCoinsSaved })], { type:'application/json' })
    );
  } catch(e){ /* best effort */ }
}

async function initProgress(){
  const { data:{ session } } = await supabaseClient.auth.getSession();
  if(!session){ window.location.href = 'login.html'; return; }
  currentUserId = session.user.id;

  const cached = loadCachedProgress()[LESSON_ID];
  if(cached && cached.completed && !isReviewMode){ window.location.href = 'home.html'; return; }
  if(cached && cached.current_round > 0 && !isReviewMode){
    roundIndex = Math.min(cached.current_round, rounds.length - 1);
  }

  const cachedProfile = loadCachedProfileState();
  if(typeof cachedProfile.hearts === 'number') hearts = cachedProfile.hearts;
  if(cachedProfile.hearts_updated_at) heartsUpdatedAt = cachedProfile.hearts_updated_at;
  if(typeof cachedProfile.coins === 'number') totalCoinsSaved = cachedProfile.coins;

  const [{ data, error }, { data: profileRow, error: profileError }] = await Promise.all([
    supabaseClient
      .from('lesson_progress')
      .select('completed, xp, coins, current_round')
      .eq('user_id', currentUserId)
      .eq('lesson_id', LESSON_ID)
      .maybeSingle(),
    supabaseClient
      .from('profiles')
      .select('hearts, hearts_updated_at, coins')
      .eq('id', currentUserId)
      .maybeSingle()
  ]);

  if(!error && data){
    upsertLocalEntry(data);
    if(data.completed && !isReviewMode){ window.location.href = 'home.html'; return; }
    if(!isReviewMode){
      roundIndex = Math.min(data.current_round || 0, rounds.length - 1);
    }
  }

  if(!profileError && profileRow && (profileRow.hearts !== null && profileRow.hearts !== undefined)){
    hearts = profileRow.hearts;
    heartsUpdatedAt = profileRow.hearts_updated_at || heartsUpdatedAt;
    totalCoinsSaved = profileRow.coins || 0;
 } else {
    await supabaseClient.rpc('update_heart_coin_state', {
      p_hearts: HEART_MAX,
      p_hearts_updated_at: heartsUpdatedAt,
      p_coins: 0
    });
  }

  updateHeader();
  switchToCheck();
  drawGuide();
  startHeartTimer();
  resetIdleTimer();
}

window.addEventListener('beforeunload', saveOnExitOrRefresh);
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden') saveOnExitOrRefresh();
});

/* ---------------- init ---------------- */
window.addEventListener('resize', sizeCanvases);
sizeCanvases();
initProgress();
</script>
