<script>

// Redirect straight to home if a session already exists
// Show loading overlay while we check auth state
const redirectOverlay = document.getElementById('redirectOverlay');
lottie.loadAnimation({
  container: document.getElementById('redirectLottie'),
  renderer: 'svg',
  loop: true,
  autoplay: true,
  path: 'assets/loading.json'
});

// NEW
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    // stay on the loading screen through the redirect
    sessionStorage.setItem('zippo_show_home_loading', '1');
    window.location.href = "home.html";
  } else {
    // no session — reveal the login form
    redirectOverlay.classList.add('is-hidden');
  }
})();

const googleBtn = document.getElementById('googleBtn');
const form = document.getElementById('signupForm');
const usernameInput = document.getElementById('username');
const pwInput = document.getElementById('password');
const termsInput = document.getElementById('terms');
const banner = document.getElementById('banner');
const signupBtn = document.getElementById('signupBtn');
const togglePw = document.getElementById('togglePw');
const strengthBars = document.querySelectorAll('#strengthRow .bar');

function isValidUsername(u) {
  return /^[a-zA-Z0-9_.]{3,20}$/.test(u);
}

const usernameStatus = document.getElementById('usernameStatus');
const checkIcon = document.getElementById('usernameCheckIcon');
const crossIcon = document.getElementById('usernameCrossIcon');
const spinnerIcon = document.getElementById('usernameSpinnerIcon');
const usernameHint = document.getElementById('usernameHint');
let usernameIsAvailable = false;

function debounce(fn, delay) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

function resetUsernameIcons() {
  checkIcon.style.display = 'none';
  crossIcon.style.display = 'none';
  spinnerIcon.style.display = 'none';
}

const checkUsernameAvailability = debounce(async (rawUsername) => {
  const username = rawUsername.trim();
  usernameHint.classList.remove('error-text', 'success-text');

  if (!isValidUsername(username)) {
    resetUsernameIcons();
    usernameIsAvailable = false;
    usernameInput.classList.remove('error');
    if (username.length > 0) {
      usernameHint.textContent = '3-20 characters: letters, numbers, _ or . only.';
      usernameHint.classList.add('error-text');
      usernameInput.classList.add('error');
    } else {
      usernameHint.textContent = '';
    }
    return;
  }

  resetUsernameIcons();
  spinnerIcon.style.display = 'block';
  usernameHint.textContent = 'Checking availability...';
  usernameInput.classList.remove('error');

  const { data: existing } = await supabaseClient
    .from('profiles')
    .select('id')
    .eq('username', username.toLowerCase())
    .maybeSingle();

  // Ignore stale responses if the input has changed since this call fired
  if (usernameInput.value.trim() !== username) return;

  resetUsernameIcons();

  if (existing) {
    crossIcon.style.display = 'block';
    usernameHint.textContent = 'That username is already taken.';
    usernameHint.classList.add('error-text');
    usernameInput.classList.add('error');
    usernameIsAvailable = false;
  } else {
    checkIcon.style.display = 'block';
    usernameHint.textContent = 'Username is available!';
    usernameHint.classList.add('success-text');
    usernameInput.classList.remove('error');
    usernameIsAvailable = true;
  }
}, 450);

usernameInput.addEventListener('input', () => {
  checkUsernameAvailability(usernameInput.value);
});

googleBtn.addEventListener('click', async () => {
  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + 'home.html' }
  });
  if (error) showBanner(banner, error.message, "error");
});

const eyeOpenIcon = document.getElementById('eyeOpenIcon');
const eyeClosedIcon = document.getElementById('eyeClosedIcon');

togglePw.addEventListener('click', () => {
  const isPw = pwInput.type === 'password';
  pwInput.type = isPw ? 'text' : 'password';
  eyeOpenIcon.style.display = isPw ? 'none' : 'block';
  eyeClosedIcon.style.display = isPw ? 'block' : 'none';
  togglePw.setAttribute('aria-label', isPw ? 'Hide password' : 'Show password');
});

const pwHint = document.getElementById('pwHint');

function isValidPassword(p) {
  return p.length >= 6 && /[^A-Za-z0-9]/.test(p);
}

pwInput.addEventListener('input', () => {
  const v = pwInput.value;
  const hasLength = v.length >= 6;
  const hasSymbol = /[^A-Za-z0-9]/.test(v);

  let score = 0;
  if (hasLength) score++;
  if (hasLength && hasSymbol) score++;
  if (v.length >= 10 && hasSymbol && /[A-Z]/.test(v) && /[0-9]/.test(v)) score++;
  strengthBars.forEach((bar, i) => {
    bar.className = 'bar';
    if (i < score) bar.classList.add(`on-${score}`);
  });

  pwInput.classList.remove('error');
  pwHint.classList.remove('error-text', 'success-text');

  if (v.length === 0) {
    pwHint.textContent = 'At least 6 characters, with 1 symbol (!@#$...)';
  } else if (!hasLength) {
    const left = 6 - v.length;
    pwHint.textContent = `${left} more character${left === 1 ? '' : 's'} needed`;
    pwHint.classList.add('error-text');
  } else if (!hasSymbol) {
    pwHint.textContent = 'Add a symbol, e.g. ! @ # $ %';
    pwHint.classList.add('error-text');
  } else {
    pwHint.textContent = "Nice, that's a valid password!";
    pwHint.classList.add('success-text');
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  banner.className = 'banner';

  const username = usernameInput.value.trim();
  const password = pwInput.value;

  document.getElementById('usernameHint').textContent = '';
  document.getElementById('pwHint').textContent = '';
  [usernameInput, pwInput].forEach(i => i.classList.remove('error'));

  let hasError = false;
  if (!isValidUsername(username)) {
    document.getElementById('usernameHint').textContent = '3-20 characters: letters, numbers, _ or . only.';
    usernameHint.classList.add('error-text');
    usernameInput.classList.add('error');
    hasError = true;
  } else if (!usernameIsAvailable) {
    document.getElementById('usernameHint').textContent = 'That username is already taken.';
    usernameHint.classList.add('error-text');
    usernameInput.classList.add('error');
    hasError = true;
  }
  if (!isValidPassword(password)) {
    document.getElementById('pwHint').textContent = 'Use at least 6 characters, with 1 symbol (!@#$...).';
    pwHint.classList.add('error-text');
    pwInput.classList.add('error');
    hasError = true;
  }
  const termsRow = document.querySelector('.terms');
  const termsHint = document.getElementById('termsHint');

  if (!termsInput.checked) {
    termsHint.textContent = "Please accept the Terms to continue.";
    termsHint.classList.add('error-text');
    termsRow.classList.remove('shake');
    void termsRow.offsetWidth; // restart animation if triggered twice in a row
    termsRow.classList.add('shake');
    hasError = true;
  } else {
    termsHint.textContent = '';
    termsHint.classList.remove('error-text');
  }
  if (hasError) return;

  setLoading(signupBtn, true, "Let's go", "Creating account...");

  // Check if the username is already taken before creating the account
  const { data: existing } = await supabaseClient
    .from('profiles')
    .select('id')
    .eq('username', username.toLowerCase())
    .maybeSingle();

  if (existing) {
    setLoading(signupBtn, false, "Let's go", "Creating account...");
    document.getElementById('usernameHint').textContent = 'That username is already taken.';
    usernameInput.classList.add('error');
    return;
  }


termsInput.addEventListener('change', () => {
  if (termsInput.checked) {
    document.getElementById('termsHint').textContent = '';
    document.getElementById('termsHint').classList.remove('error-text');
    termsInput.classList.remove('pop');
    void termsInput.offsetWidth;
    termsInput.classList.add('pop');
  }
});

  // Supabase Auth requires an email under the hood — we synthesize one

  // Supabase Auth requires an email under the hood — we synthesize one
  // from the username so the user never sees or types an email.
  const internalEmail = `${username.toLowerCase()}@users.internal.zippo`;

  const { data, error } = await supabaseClient.auth.signUp({
    email: internalEmail,
    password: password,
    options: {
      data: { username: username, display_name: username }
    }
  });

  setLoading(signupBtn, false, "Let's go", "Creating account...");

  if (error) {
    showBanner(banner, error.message || "Could not create account.", "error");
    return;
  }

  showBanner(banner, "Account created! Redirecting...", "success");
  sessionStorage.setItem('zippo_show_home_loading', '1');
  redirectOverlay.classList.remove('is-hidden');
  window.location.href = "home.html";
});
</script>
