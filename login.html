<script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src=""></script>
<script>
const redirectOverlay = document.getElementById('redirectOverlay');
lottie.loadAnimation({
  container: document.getElementById('redirectLottie'),
  renderer: 'svg',
  loop: true,
  autoplay: true,
  path: 'assets/loading.json'
});

// Redirect straight to home if a session already exists
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    sessionStorage.setItem('zippo_show_home_loading', '1');
    window.location.href = "home.html";
  } else {
    // no session — reveal the login form
    redirectOverlay.classList.add('is-hidden');
  }
})();

const form = document.getElementById('loginForm');
const usernameInput = document.getElementById('username');
const pwInput = document.getElementById('password');
const banner = document.getElementById('banner');
const loginBtn = document.getElementById('loginBtn');
const togglePw = document.getElementById('togglePw');
const googleBtn = document.getElementById('googleBtn');

const eyeOpenIcon = document.getElementById('eyeOpenIcon');
const eyeClosedIcon = document.getElementById('eyeClosedIcon');

togglePw.addEventListener('click', () => {
  const isPw = pwInput.type === 'password';
  pwInput.type = isPw ? 'text' : 'password';
  eyeOpenIcon.style.display = isPw ? 'none' : 'block';
  eyeClosedIcon.style.display = isPw ? 'block' : 'none';
  togglePw.setAttribute('aria-label', isPw ? 'Hide password' : 'Show password');
});

googleBtn.addEventListener('click', async () => {
  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: window.location.origin + '/home.html'
    }
  });
  if (error) {
    showBanner(banner, error.message, "error");
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  banner.className = 'banner';

  const username = usernameInput.value.trim();
  const password = pwInput.value;

  document.getElementById('usernameHint').textContent = '';
  document.getElementById('pwHint').textContent = '';
  [usernameInput, pwInput].forEach(i => i.classList.remove('error'));

  let hasError = false;
  if (username.length < 3) {
    document.getElementById('usernameHint').textContent = 'Enter your username.';
    usernameInput.classList.add('error');
    hasError = true;
  }
  if (password.length < 1) {
    document.getElementById('pwHint').textContent = 'Enter your password.';
    pwInput.classList.add('error');
    hasError = true;
  }
  if (hasError) return;

  setLoading(loginBtn, true, "Log in", "Logging in...");

  // Rebuild the same internal email we used at signup
  const internalEmail = `${username.toLowerCase()}@users.internal.zippo`;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: internalEmail,
    password: password
  });

  setLoading(loginBtn, false, "Log in", "Logging in...");

 // NEW
  if (error) {
    showBanner(banner, "Incorrect username or password.", "error");
    return;
  }

  showBanner(banner, "Welcome back! Redirecting...", "success");
  sessionStorage.setItem('zippo_show_home_loading', '1');
  redirectOverlay.classList.remove('is-hidden');
  window.location.href = "home.html";
});
</script>
